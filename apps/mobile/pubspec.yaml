name: listro_mobile
description: Listro customer app for premium shoe cleaning and care.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  shared_preferences: ^2.5.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/Shoe Shine Aqua Sparkle Icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "icon/Shoe Shine Aqua Sparkle Icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/listro_icon.png
