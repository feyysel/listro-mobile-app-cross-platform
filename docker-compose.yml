
services:
  postgres:
    image: postgres:17-alpine
    container_name: listro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: listro_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: listro_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - listro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listro_user -d listro_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: listro-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - listro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  listro_postgres_data:
  listro_redis_data:
